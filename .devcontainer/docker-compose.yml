name: crystalframework-dev-container
services:
  dev-server:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/crystalframework:cached
      - ./.m2/repository:/root/.m2/repository
    command: sleep infinity
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
      - "${FRONTEND_PORT}:5173"
    networks:
      - crystalframework-dev-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DATABASE}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - crystalframework-dev-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.2
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    networks:
      - crystalframework-dev-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 3s
      timeout: 5s
      retries: 5

  snailjob:
    build:
      context: ../docker/dev/snail-job
      dockerfile: Dockerfile
    environment:
      SNAILJOB_DATASOURCE_HOST: postgres
      SNAILJOB_DATASOURCE_PORT: 5432
      SNAILJOB_DATASOURCE_DATABASE: ${POSTGRES_DATABASE}
      SNAILJOB_DATASOURCE_USERNAME: ${POSTGRES_USERNAME}
      SNAILJOB_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${SNAILJOB_SERVER_WEB_PORT}:8080"
      - "${SNAILJOB_SERVER_PORT}:17888"
    volumes:
      - ../docker/dev/config/snail-job:/app/config:ro
    networks:
      - crystalframework-dev-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "${PROMETHEUS_PORT}:9090"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    networks:
      - crystalframework-dev-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "${GRAFANA_PORT}:3000"
    volumes:
      - grafana-data/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - crystalframework-dev-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_STACK_VERSION}
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      # Fleet (used by the APM integration) requires security to be enabled, hence xpack.security stays on.
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - ES_JAVA_OPTS=-Xms256m -Xmx512m
    ports:
      - "${ELASTICSEARCH_PORT}:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - crystalframework-dev-network
    healthcheck:
      # Security is on, so the health probe must authenticate as the elastic superuser.
      test: ["CMD-SHELL", "curl -sf -u elastic:${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  kibana:
    image: docker.elastic.co/kibana/kibana:${ELASTIC_STACK_VERSION}
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      # Kibana authenticates to ES with an elastic/kibana service-account token (generated manually and
      # placed in .env), never with the elastic superuser, per Elastic 8.x guidance.
      - ELASTICSEARCH_SERVICEACCOUNTTOKEN=${KIBANA_SERVICE_TOKEN}
      # Fleet stores encrypted saved objects; Kibana refuses to start Fleet without a >=32 char key.
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=${KIBANA_ENCRYPTION_KEY}
    ports:
      - "${KIBANA_PORT}:5601"
    networks:
      - crystalframework-dev-network
    depends_on:
      elasticsearch:
        condition: service_healthy

  apm-server:
    image: docker.elastic.co/apm/apm-server:${ELASTIC_STACK_VERSION}
    container_name: apm-server
    command:
      - "--strict.perms=false"
      - "-E"
      - "apm-server.host=0.0.0.0:8200"
      - "-E"
      - "output.elasticsearch.hosts=[\"elasticsearch:9200\"]"
      # Security is on, so the APM Server must authenticate to ES. Using the elastic superuser here keeps
      # the dev setup simple; a dedicated apm_system-style user is preferable in production.
      - "-E"
      - "output.elasticsearch.username=elastic"
      - "-E"
      - "output.elasticsearch.password=${ELASTIC_PASSWORD}"
      - "-E"
      - "apm-server.kibana.enabled=true"
      - "-E"
      - "apm-server.kibana.host=kibana:5601"
      - "-E"
      - "apm-server.kibana.username=elastic"
      - "-E"
      - "apm-server.kibana.password=${ELASTIC_PASSWORD}"
    ports:
      - "${APM_SERVER_PORT}:8200"
    networks:
      - crystalframework-dev-network
    depends_on:
      elasticsearch:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  prometheus-data:
  grafana-data:
  elasticsearch-data:

networks:
  crystalframework-dev-network:
    driver: bridge
