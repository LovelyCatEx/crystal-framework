global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'crystalframework'
    # Scrape the internal-only actuator management port over the shared container network.
    # In the devcontainer the app runs inside the 'dev-server' service; this port is never
    # published to the host, so it is unreachable from outside the network.
    metrics_path: '/actuator/prometheus'
    scrape_interval: 5s
    static_configs:
      - targets: ['host.docker.internal:9100']
        labels:
          application: 'crystalframework'
          environment: 'production'