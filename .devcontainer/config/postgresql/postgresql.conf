# PostgreSQL Configuration for Crystal Framework
# This file contains custom settings required for distributed transactions

# =====================================================================
# Connection Settings
# =====================================================================
listen_addresses = '*'
max_connections = 100
shared_buffers = 128MB

# =====================================================================
# Two-Phase Commit (2PC) Configuration
# =====================================================================
# Required for distributed transactions across multiple shards
# Set to at least: max_connections * 2
# Default: 0 (disabled)
max_prepared_transactions = 100

# =====================================================================
# Write-Ahead Log (WAL) Settings
# =====================================================================
# These ensure prepared transactions survive crashes
wal_level = replica
max_wal_size = 1GB
min_wal_size = 80MB

# =====================================================================
# Logging
# =====================================================================
# Enable logging of prepared transactions for debugging
log_checkpoints = on
log_connections = on
log_disconnections = on
log_duration = off
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '

# =====================================================================
# Query Tuning
# =====================================================================
effective_cache_size = 4GB
maintenance_work_mem = 64MB
checkpoint_completion_target = 0.9
random_page_cost = 1.1
effective_io_concurrency = 200
work_mem = 4MB
min_wal_size = 1GB
max_wal_size = 4GB
